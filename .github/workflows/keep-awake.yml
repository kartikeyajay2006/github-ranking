# Render's free plan sleeps after 15 idle minutes, which would pause background ranking.
# Pinging the health check every 10 minutes keeps it awake. Set the repository variable SITE_URL.
name: Keep awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${{ vars.SITE_URL }}/api/health"
